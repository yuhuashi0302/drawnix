name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: List schemes
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -list

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Web
        run: |
          npm ci
          npm run build || true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods deps
        run: |
          cd ios/App
          pod install

      - name: Build unsigned IPA
        run: |
          set -e
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload
          zip -r ../../Drawnix-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Drawnix-IPA
          path: Drawnix-unsigned.ipa